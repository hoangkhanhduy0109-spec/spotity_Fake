<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Ứng dụng nghe nhạc trực tuyến phong cách Spotify">
    <title>Nghe nhạc</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
:root{
  --bg:#0c0e1a; --bg-2:#12152a; --surface:#181c33; --surface-2:#20254a;
  --text:#f3f4fb; --muted:#9aa0c3;
  --rose:#ff4f8b; --violet:#7a5cff; --grad:linear-gradient(135deg,var(--rose),var(--violet));
  --radius:18px; --player-h:96px;
  --font:'Plus Jakarta Sans','Inter',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);overflow:hidden;
  background-image:radial-gradient(900px 500px at 85% -10%,rgba(122,92,255,.22),transparent 60%),radial-gradient(700px 400px at -10% 10%,rgba(255,79,139,.14),transparent 60%);}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--rose);outline-offset:2px}

.app-container{height:100vh;display:flex;flex-direction:column}

/* Header */
.header{display:flex;align-items:center;gap:24px;padding:16px 32px;position:sticky;top:0;z-index:10;
  background:rgba(12,14,26,.7);backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,.06)}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.35rem;letter-spacing:-.02em}
.logo i{font-size:1.9rem;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.search-container{flex:1;max-width:520px;margin:0 auto;position:relative}
.search-container i{position:absolute;left:18px;top:50%;transform:translateY(-50%);color:var(--muted)}
#search-input{width:100%;padding:13px 20px 13px 48px;border-radius:999px;border:1px solid transparent;
  background:var(--surface);color:var(--text);font:500 .95rem var(--font);transition:border-color .2s,background .2s}
#search-input::placeholder{color:var(--muted)}
#search-input:focus{outline:0;border-color:var(--violet);background:var(--surface-2)}

/* Main */
.main-content{flex:1;overflow-y:auto;padding:32px 32px calc(var(--player-h) + 32px);scrollbar-width:thin;scrollbar-color:var(--surface-2) transparent}
#greeting{font-size:clamp(1.8rem,4vw,2.8rem);font-weight:800;letter-spacing:-.03em;margin-bottom:28px}
.song-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:22px}
.song-card{background:var(--surface);border-radius:var(--radius);padding:14px;cursor:pointer;position:relative;
  transition:background .2s,transform .2s}
.song-card:hover{background:var(--surface-2);transform:translateY(-4px)}
.song-card .cover{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;margin-bottom:14px;background:var(--bg-2)}
.song-card img{width:100%;height:100%;object-fit:cover;display:block}
.song-card .play-overlay{position:absolute;right:10px;bottom:10px;width:46px;height:46px;border-radius:50%;
  background:var(--grad);display:grid;place-items:center;opacity:0;transform:translateY(8px);transition:.25s;box-shadow:0 8px 20px rgba(255,79,139,.4)}
.song-card:hover .play-overlay,.song-card.active .play-overlay{opacity:1;transform:none}
.song-card h4{font-size:.95rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song-card p{font-size:.82rem;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song-card.active h4{color:var(--rose)}
.empty{grid-column:1/-1;color:var(--muted);padding:40px 0;text-align:center}
.skeleton{aspect-ratio:3/4;border-radius:var(--radius);background:linear-gradient(90deg,var(--surface) 25%,var(--surface-2) 50%,var(--surface) 75%);background-size:200% 100%;animation:shine 1.4s infinite}
@keyframes shine{to{background-position:-200% 0}}

.load-more-container{display:flex;justify-content:center;margin-top:36px}
.load-more-btn{padding:12px 32px;border-radius:999px;border:1px solid rgba(255,255,255,.18);font-weight:700;transition:.2s}
.load-more-btn:hover{background:var(--grad);border-color:transparent}

/* Player bar */
.player-bar{position:fixed;left:0;right:0;bottom:0;height:var(--player-h);z-index:20;display:grid;grid-template-columns:1fr 1.4fr 1fr;align-items:center;gap:16px;padding:0 28px;
  background:rgba(18,21,42,.85);backdrop-filter:blur(20px);border-top:1px solid rgba(255,255,255,.08)}
.current-track{display:flex;align-items:center;gap:14px;min-width:0;cursor:pointer}
.track-img{width:58px;height:58px;border-radius:12px;overflow:hidden;flex:none;background:var(--surface)}
.track-img img{width:100%;height:100%;object-fit:cover}
.track-info{min-width:0}
.track-name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track-artist{font-size:.82rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player-controls{display:flex;flex-direction:column;align-items:center;gap:8px}
.control-buttons{display:flex;align-items:center;gap:20px}
.btn-icon{color:var(--muted);font-size:1.05rem;padding:6px;transition:color .2s,transform .2s}
.btn-icon:hover{color:var(--text)}
.btn-icon.active{color:var(--rose)}
.btn-play{width:44px;height:44px;border-radius:50%;background:var(--grad);display:grid;place-items:center;transition:transform .2s;box-shadow:0 6px 18px rgba(122,92,255,.45)}
.btn-play:hover{transform:scale(1.08)}
.progress-bar-container{display:flex;align-items:center;gap:10px;width:100%;max-width:560px;font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
.progress-bar,.volume-bar{flex:1;height:6px;border-radius:99px;background:rgba(255,255,255,.12);cursor:pointer;position:relative}
.progress-bar::before,.volume-bar::before{content:"";position:absolute;inset:-8px 0}
.progress-filled,.volume-filled{height:100%;width:0;border-radius:inherit;background:var(--grad);position:relative}
.progress-filled::after,.volume-filled::after{content:"";position:absolute;right:-6px;top:50%;width:12px;height:12px;border-radius:50%;background:#fff;transform:translateY(-50%) scale(0);transition:transform .15s}
.progress-bar:hover .progress-filled::after,.volume-bar:hover .volume-filled::after{transform:translateY(-50%) scale(1)}
.extra-controls{display:flex;align-items:center;justify-content:flex-end;gap:12px;color:var(--muted)}
.volume-bar{flex:none;width:110px}

@media (max-width:820px){
  :root{--player-h:128px}
  .header{padding:12px 16px;gap:12px}.logo span{display:none}
  .main-content{padding:20px 16px calc(var(--player-h) + 20px)}
  .song-grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}
  .player-bar{grid-template-columns:1fr;gap:6px;padding:10px 16px}
  .extra-controls{display:none}
  .track-img{width:44px;height:44px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.modal{position:fixed;inset:0;z-index:50;visibility:hidden;opacity:0;transform:translateY(100%);transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .3s,visibility .45s}
.modal.open{visibility:visible;opacity:1;transform:none}
.modal-bg{position:absolute;inset:-60px;background:#0c0e1a center/cover no-repeat;filter:blur(70px) saturate(1.4) brightness(.45);transition:background-image .5s}
.modal-content{position:relative;height:100%;padding:28px 40px;display:flex;flex-direction:column}
.close-btn,.scroll-top-btn{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.1);backdrop-filter:blur(10px);display:grid;place-items:center;transition:background .2s}
.close-btn:hover,.scroll-top-btn:hover{background:rgba(255,255,255,.2)}
.scroll-top-btn{position:absolute;right:40px;bottom:32px;z-index:2}
.modal-body{flex:1;min-height:0;display:grid;grid-template-columns:1.1fr 1fr;gap:48px;margin-top:8px}
.modal-left{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;min-height:0}
.disc-wrapper{width:min(46vh,380px);aspect-ratio:1}
.disc-container{position:relative;width:100%;height:100%;border-radius:50%;box-shadow:0 30px 70px rgba(0,0,0,.55),0 0 0 10px rgba(255,255,255,.06);animation:spin 18s linear infinite;animation-play-state:paused}
.disc-container.playing{animation-play-state:running}
.disc-img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.disc-center{position:absolute;top:50%;left:50%;width:18%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:var(--bg);box-shadow:inset 0 0 0 6px rgba(255,255,255,.12)}
@keyframes spin{to{transform:rotate(360deg)}}
.modal-track-info{text-align:center;width:100%;max-width:520px}
#modal-title{font-size:clamp(1.4rem,3vw,2rem);font-weight:800;letter-spacing:-.02em}
#modal-artist{color:var(--muted);margin:6px 0 22px}
.modal-player-controls{display:flex;flex-direction:column;align-items:center;gap:16px}
.modal-right{display:flex;flex-direction:column;min-height:0}
.modal-right h3{font-size:1.15rem;margin-bottom:16px}
.queue-list{flex:1;overflow-y:auto;padding-right:8px;display:flex;flex-direction:column;gap:6px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.25) transparent}
.queue-item{display:flex;align-items:center;gap:14px;padding:10px;border-radius:14px;cursor:pointer;transition:background .2s}
.queue-item:hover{background:rgba(255,255,255,.08)}
.queue-item.active{background:rgba(255,79,139,.16)}
.queue-item img{width:52px;height:52px;border-radius:10px;object-fit:cover;flex:none}
.queue-item .q-info{min-width:0}
.queue-item .q-title{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.queue-item .q-artist{font-size:.82rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.queue-item.active .q-title{color:var(--rose)}

@media (max-width:820px){
  .modal-content{padding:16px}
  .modal-body{grid-template-columns:1fr;gap:20px;overflow-y:auto}
  .modal-left{justify-content:flex-start}
  .disc-wrapper{width:min(62vw,280px)}
  .modal-right{min-height:360px}
  .scroll-top-btn{right:16px;bottom:16px}
}
    </style>
</head>
<body>
    <div class="app-container">
        <header class="header">
            <div class="logo"><i class="fa-brands fa-spotify"></i><span>Spotify</span></div>
            <div class="search-container">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="search-input" placeholder="Bạn muốn nghe gì?" autocomplete="off">
            </div>
        </header>
        <main class="main-content">
            <section class="content-section" id="view-home">
                <h1 id="greeting"></h1>
                <div class="song-grid" id="song-list"></div>
                <div class="load-more-container" id="load-more-container">
                    <button id="btn-load-more" class="load-more-btn">Xem thêm</button>
                </div>
            </section>
        </main>
        <footer class="player-bar">
            <div class="current-track">
                <div class="track-img"><img id="player-img" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 10 10'%3E%3Crect width='10' height='10' fill='%23181c33'/%3E%3C/svg%3E" alt="Ảnh bài hát"></div>
                <div class="track-info">
                    <div id="player-title" class="track-name">Chọn một bài hát</div>
                    <div id="player-artist" class="track-artist">Nghệ sĩ</div>
                </div>
            </div>
            <div class="player-controls">
                <div class="control-buttons">
                    <button id="btn-shuffle" class="btn-icon" title="Trộn bài"><i class="fa-solid fa-shuffle"></i></button>
                    <button id="btn-prev" class="btn-icon" title="Bài trước"><i class="fa-solid fa-backward-step"></i></button>
                    <button id="btn-play-pause" class="btn-play" title="Phát / Tạm dừng"><i class="fa-solid fa-play"></i></button>
                    <button id="btn-next" class="btn-icon" title="Bài sau"><i class="fa-solid fa-forward-step"></i></button>
                    <button id="btn-repeat" class="btn-icon" title="Lặp lại"><i class="fa-solid fa-repeat"></i></button>
                </div>
                <div class="progress-bar-container">
                    <span id="current-time">0:00</span>
                    <div class="progress-bar" id="progress-container"><div class="progress-filled" id="progress-indicator"></div></div>
                    <span id="duration">0:00</span>
                </div>
            </div>
            <div class="extra-controls">
                <i class="fa-solid fa-volume-high"></i>
                <div class="volume-bar" id="volume-container"><div class="volume-filled" id="volume-indicator" style="width:80%"></div></div>
            </div>
        </footer>
    </div>

    <div id="playing-modal" class="modal">
        <div id="modal-bg" class="modal-bg"></div>
        <div class="modal-content">
            <button id="btn-close-modal" class="close-btn" title="Đóng"><i class="fa-solid fa-chevron-down"></i></button>
            <button id="btn-scroll-top" class="scroll-top-btn" title="Lên đầu danh sách"><i class="fa-solid fa-arrow-up"></i></button>
            <div class="modal-body">
                <div class="modal-left">
                    <div class="disc-wrapper">
                        <div class="disc-container" id="disc-container">
                            <img id="modal-disc-img" src="" alt="Đĩa nhạc" class="disc-img">
                            <div class="disc-center"></div>
                        </div>
                    </div>
                    <div class="modal-track-info">
                        <h2 id="modal-title">Tiêu đề</h2>
                        <p id="modal-artist">Nghệ sĩ</p>
                        <div class="modal-player-controls">
                            <div class="control-buttons">
                                <button id="modal-btn-shuffle" class="btn-icon" title="Trộn bài"><i class="fa-solid fa-shuffle"></i></button>
                                <button id="modal-btn-prev" class="btn-icon"><i class="fa-solid fa-backward-step"></i></button>
                                <button id="modal-btn-play-pause" class="btn-play"><i class="fa-solid fa-play"></i></button>
                                <button id="modal-btn-next" class="btn-icon"><i class="fa-solid fa-forward-step"></i></button>
                                <button id="modal-btn-repeat" class="btn-icon" title="Lặp lại"><i class="fa-solid fa-repeat"></i></button>
                            </div>
                            <div class="progress-bar-container">
                                <span id="modal-current-time">0:00</span>
                                <div class="progress-bar" id="modal-progress-container"><div class="progress-filled" id="modal-progress-indicator"></div></div>
                                <span id="modal-duration">0:00</span>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-right">
                    <h3>Danh sách phát tiếp theo</h3>
                    <div id="queue-list" class="queue-list"></div>
                </div>
            </div>
        </div>
    </div>

    <audio id="main-audio" preload="none"></audio>
    <script>
// Nguồn nhạc: iTunes Search API (miễn phí, không cần key, bản nghe thử 30 giây)
const API = 'https://itunes.apple.com/search';
const PAGE = 12;
const $ = id => document.getElementById(id);
const audio = $('main-audio');

const state = { tracks: [], shown: 0, index: -1, shuffle: false, repeat: false, term: 'nhạc việt' };

// ---------- API ----------
async function fetchTracks(term) {
  const url = `${API}?term=${encodeURIComponent(term)}&media=music&entity=song&country=VN&limit=60`;
  const res = await fetch(url);
  if (!res.ok) throw new Error('Không tải được dữ liệu');
  const data = await res.json();
  return data.results
    .filter(t => t.previewUrl)
    .map(t => ({
      id: t.trackId, title: t.trackName, artist: t.artistName,
      cover: t.artworkUrl100.replace('100x100', '400x400'),
      thumb: t.artworkUrl100, src: t.previewUrl
    }));
}

async function load(term) {
  state.term = term; state.shown = 0;
  $('song-list').innerHTML = Array(8).fill('<div class="skeleton"></div>').join('');
  $('load-more-container').style.display = 'none';
  try {
    state.tracks = await fetchTracks(term);
  } catch (e) {
    state.tracks = [];
    $('song-list').innerHTML = `<p class="empty">${e.message}. Kiểm tra mạng rồi thử lại.</p>`;
    return;
  }
  $('song-list').innerHTML = '';
  if (!state.tracks.length) {
    $('song-list').innerHTML = `<p class="empty">Không tìm thấy bài hát nào cho “${term}”.</p>`;
    return;
  }
  showMore();
}

// ---------- Render ----------
function showMore() {
  const list = $('song-list');
  const end = Math.min(state.shown + PAGE, state.tracks.length);
  for (let i = state.shown; i < end; i++) {
    const t = state.tracks[i];
    const el = document.createElement('div');
    el.className = 'song-card'; el.dataset.i = i;
    el.innerHTML = `<div class="cover"><img loading="lazy" src="${t.cover}" alt=""><div class="play-overlay"><i class="fa-solid fa-play"></i></div></div><h4></h4><p></p>`;
    el.querySelector('h4').textContent = t.title;
    el.querySelector('p').textContent = t.artist;
    el.onclick = () => play(i);
    list.appendChild(el);
  }
  state.shown = end;
  $('load-more-container').style.display = end < state.tracks.length ? 'flex' : 'none';
}

function renderQueue() {
  const q = $('queue-list'); q.innerHTML = '';
  state.tracks.forEach((t, i) => {
    const el = document.createElement('div');
    el.className = 'queue-item' + (i === state.index ? ' active' : '');
    el.innerHTML = `<img loading="lazy" src="${t.thumb}" alt=""><div class="q-info"><div class="q-title"></div><div class="q-artist"></div></div>`;
    el.querySelector('.q-title').textContent = t.title;
    el.querySelector('.q-artist').textContent = t.artist;
    el.onclick = () => play(i);
    q.appendChild(el);
  });
}

// ---------- Playback ----------
function play(i) {
  const t = state.tracks[i]; if (!t) return;
  state.index = i;
  audio.src = t.src;
  audio.play().catch(() => {});
  $('player-img').src = t.cover; $('player-title').textContent = t.title; $('player-artist').textContent = t.artist;
  $('modal-disc-img').src = t.cover; $('modal-title').textContent = t.title; $('modal-artist').textContent = t.artist;
  $('modal-bg').style.backgroundImage = `url("${t.cover}")`;
  document.title = `${t.title} • ${t.artist}`;
  document.querySelectorAll('.song-card').forEach(c => c.classList.toggle('active', +c.dataset.i === i));
  renderQueue();
}

function next(auto) {
  if (!state.tracks.length) return;
  if (auto && state.repeat) { audio.currentTime = 0; audio.play(); return; }
  let n = state.shuffle ? Math.floor(Math.random() * state.tracks.length) : (state.index + 1) % state.tracks.length;
  play(n);
}
function prev() {
  if (audio.currentTime > 3) { audio.currentTime = 0; return; }
  play((state.index - 1 + state.tracks.length) % state.tracks.length);
}
function toggle() {
  if (state.index < 0) return play(0);
  audio.paused ? audio.play() : audio.pause();
}

const fmt = s => isNaN(s) ? '0:00' : `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;

audio.addEventListener('play', () => syncPlay(true));
audio.addEventListener('pause', () => syncPlay(false));
audio.addEventListener('ended', () => next(true));
audio.addEventListener('loadedmetadata', () => { $('duration').textContent = $('modal-duration').textContent = fmt(audio.duration); });
audio.addEventListener('timeupdate', () => {
  const p = audio.duration ? (audio.currentTime / audio.duration) * 100 : 0;
  $('progress-indicator').style.width = $('modal-progress-indicator').style.width = p + '%';
  $('current-time').textContent = $('modal-current-time').textContent = fmt(audio.currentTime);
});
function syncPlay(on) {
  const icon = on ? 'fa-pause' : 'fa-play';
  ['btn-play-pause', 'modal-btn-play-pause'].forEach(id => $(id).innerHTML = `<i class="fa-solid ${icon}"></i>`);
  $('disc-container').classList.toggle('playing', on);
}

// ---------- Controls ----------
function bind(ids, fn) { ids.forEach(id => $(id).addEventListener('click', fn)); }
bind(['btn-play-pause', 'modal-btn-play-pause'], toggle);
bind(['btn-next', 'modal-btn-next'], () => next(false));
bind(['btn-prev', 'modal-btn-prev'], prev);
bind(['btn-shuffle', 'modal-btn-shuffle'], () => { state.shuffle = !state.shuffle; ['btn-shuffle', 'modal-btn-shuffle'].forEach(id => $(id).classList.toggle('active', state.shuffle)); });
bind(['btn-repeat', 'modal-btn-repeat'], () => { state.repeat = !state.repeat; ['btn-repeat', 'modal-btn-repeat'].forEach(id => $(id).classList.toggle('active', state.repeat)); });

function seekBar(id, fn) {
  const el = $(id);
  const move = e => { const r = el.getBoundingClientRect(); fn(Math.min(1, Math.max(0, (e.clientX - r.left) / r.width))); };
  el.addEventListener('pointerdown', e => { move(e); const m = ev => move(ev); window.addEventListener('pointermove', m); window.addEventListener('pointerup', () => window.removeEventListener('pointermove', m), { once: true }); });
}
const seek = r => { if (audio.duration) audio.currentTime = r * audio.duration; };
seekBar('progress-container', seek); seekBar('modal-progress-container', seek);
seekBar('volume-container', r => { audio.volume = r; $('volume-indicator').style.width = r * 100 + '%'; });
audio.volume = 0.8;

// ---------- Modal ----------
const modal = $('playing-modal');
document.querySelector('.current-track').onclick = () => { if (state.index >= 0) modal.classList.add('open'); };
$('btn-close-modal').onclick = () => modal.classList.remove('open');
$('btn-scroll-top').onclick = () => $('queue-list').scrollTo({ top: 0, behavior: 'smooth' });
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.code === 'Space') { e.preventDefault(); toggle(); }
  if (e.key === 'Escape') modal.classList.remove('open');
});

// ---------- Search & init ----------
let timer;
$('search-input').addEventListener('input', e => {
  clearTimeout(timer);
  timer = setTimeout(() => load(e.target.value.trim() || 'nhạc việt'), 500);
});
